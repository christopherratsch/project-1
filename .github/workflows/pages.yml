name: Deploy to GitHub Pages

on:
  push:
    branches:
      - claude/birthday-party-organizer-0bo29o
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # Voraussetzung (einmalig, von Hand):
      # Settings -> Pages -> Source: "GitHub Actions"
      # Das Anlegen der Pages-Site per Workflow ist nicht möglich,
      # der GITHUB_TOKEN darf das nicht.
      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - id: deployment
        uses: actions/deploy-pages@v4
